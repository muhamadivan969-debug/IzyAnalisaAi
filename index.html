<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IzyAnalisaAI - Analisis Saham IDX & AI</title>
  <link rel="stylesheet" href="style.css">
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>
  <header class="navbar">
    <h1>IzyAnalisaAI</h1>
    <div id="ihsgWidget" class="ihsg-badge">IHSG: <span id="ihsgVal">Loading...</span></div>
  </header>

  <main class="container">
    <section class="search-section">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari Kode Saham (contoh: BBCA, BUMI)..." autocomplete="off" />
        <div id="autocompleteBox"></div>
      </div>
    </section>

    <section class="main-grid">
      <div class="chart-container">
        <div id="tradingview_chart"></div>
      </div>

      <div class="chat-container">
        <div class="chat-header">Asisten AI IzyAnalisa</div>
        <div id="chatMessages" class="chat-messages">
          <div class="msg ai-msg">Halo! Tanyakan seputar analisis saham IDX atau strategi trading.</div>
        </div>
        <div class="chat-input-area">
          <input type="text" id="chatInput" placeholder="Ketik pertanyaan di sini..." />
          <button id="chatSendBtn">Kirim</button>
        </div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
